id: Colorec_Amgen_2006_263
source: PDS
nct: NCT00339183
title: 'Amgen 20050181: panitumumab plus FOLFIRI vs FOLFIRI, second-line metastatic colorectal'
design: parallel
unit: individual
status: included
arms:
  file: demo.sas7bdat
  subject: SUBJID
  column: TRT
  evidence: 'DDT: TRT = randomized treatment (TRTCD 40/41); ATRT = actual'
tables:
- file: lab.sas7bdat
  kind: long
  subject: SUBJID
  param: LBTESTCD
  value: LBSTRESN
  visit: VISIT
  role: safety_lab
  visits:
    pre:
    - Screening
    pre_dose:
    - Cycle 1, day 1
    post: ^Cycle (\d+), day (\d+)$
  exclude_params:
    PR24HU: rule 13 (69 rows)
    PROT_U: rule 13
    HCGBETC: rule 13
    TSH: rule 13
    CRCL_E: derived creatinine clearance (rule 8 derivation)
  param_roles:
    CEA: secondary
- file: vitals_v.sas7bdat
  kind: long
  subject: SUBJID
  param: VSTESTCD
  value: VSSTRES
  visit: VISIT
  role: vital
  visits:
    pre:
    - Screening
    pre_dose:
    - Cycle 1, day 1
    post: ^Cycle (\d+), day (\d+)$
  exclude_params:
    ECOG: rule 9
- file: lesion.sas7bdat
  kind: long
  subject: SUBJID
  param: LSCAT
  value: LSSLD
  visit: VISIT
  role: tumour
  visits:
    pre:
    - Screening
    pre_dose: []
    post: ^Week (\d+)$
  exclude_params:
    New lesion: rule 8
    Non-target lesion: rule 9
